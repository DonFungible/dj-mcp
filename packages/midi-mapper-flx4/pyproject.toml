[project]
name = "midi-mapper-flx4"
version = "0.1.0"
description = "Turn a Pioneer DDJ-FLX4 into a macro pad you set up by talking to your AI assistant (MCP server + CLI + GUI)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Don Fung" }]
keywords = ["mcp", "midi", "macro", "ddj-flx4", "pioneer", "keyboard", "shortcuts", "dj"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=2.0,<3",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "pynput>=1.7",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/DonFungible/dj-mcp/tree/main/packages/midi-mapper-flx4"
Repository = "https://github.com/DonFungible/dj-mcp"
Issues = "https://github.com/DonFungible/dj-mcp/issues"

[project.scripts]
midi-mapper-flx4 = "midi_mapper_flx4.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midi_mapper_flx4"]
